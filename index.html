<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="data:," />
  <title>Polizei Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --danger: #ef4444;
      --success: #22c55e;
      --glass: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.06);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --glass: rgba(15, 23, 42, 0.85);
        --glass-border: rgba(255, 255, 255, 0.08);
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    button { font-family: inherit; touch-action: manipulation; }

    #map { position: fixed; inset: 0; z-index: 0; background: var(--bg); }

    /* Top status pill */
    #top-bar {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
    }

    #status-pill {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #status-pill::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
      animation: dotPulse 2s infinite;
    }

    #status-pill.empty::before { background: var(--text-muted); animation: none; box-shadow: none; }

    @keyframes dotPulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Bottom toolbar */
    #bottom-bar {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
      pointer-events: none;
    }

    .tool-btn {
      pointer-events: auto;
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .tool-btn:active { transform: scale(0.92); }

    .tool-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Hint */
    #hint {
      position: fixed;
      bottom: calc(96px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      box-shadow: var(--shadow);
      z-index: 1000;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #hint.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(10px);
    }

    /* Toast */
    #toast {
      position: fixed;
      top: calc(64px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--text);
      color: var(--bg);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      max-width: 90vw;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Remove default Leaflet div-icon box */
    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }

    /* Police marker */
    .police-marker-wrap {
      position: relative;
      width: 40px; height: 40px;
    }

    .police-marker {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.45), 0 0 0 3px white;
      position: relative;
      z-index: 2;
    }

    .police-marker.old {
      background: linear-gradient(135deg, #94a3b8, #64748b);
      box-shadow: 0 4px 12px rgba(100, 116, 139, 0.3), 0 0 0 3px white;
      opacity: 0.75;
    }

    .police-marker-wrap::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.3);
      animation: markerPulse 2s infinite;
      z-index: 1;
    }

    .police-marker-wrap.old::before { display: none; }

    @keyframes markerPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* Modern popup */
    .leaflet-popup-content-wrapper {
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
      border-radius: 0 !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      padding: 0 !important;
      width: auto !important;
    }
    .leaflet-popup-tip {
      background: var(--glass) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15) !important;
    }
    .leaflet-popup { margin-bottom: 20px; }

    .popup {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 16px;
      min-width: 200px;
      box-shadow: var(--shadow);
      font-family: inherit;
    }

    .popup-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .popup-age {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .popup-confirm {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: none;
      background: var(--success);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .popup-confirm:active { opacity: 0.7; }

    .popup-clear {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: var(--danger);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .popup-clear:active { opacity: 0.7; }

    /* Leaflet attribution restyled */
    .leaflet-control-attribution {
      background: var(--glass) !important;
      backdrop-filter: blur(10px);
      border-radius: 8px 0 0 0;
      font-size: 10px !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="top-bar">
    <div id="status-pill" class="empty">Keine Meldungen</div>
  </div>

  <div id="hint">Tippe auf die Karte, um Polizei zu melden</div>

  <div id="bottom-bar">
    <button id="locate-btn" class="tool-btn" aria-label="Eigene Position">📍</button>
    <button id="notify-btn" class="tool-btn" aria-label="Benachrichtigungen">
      <span id="notify-icon">🔕</span>
    </button>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, deleteDoc, doc,
      updateDoc, increment,
      onSnapshot, query, where, getDocs, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    // --- CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyCh4CiPSYJgrxMOZTWNt3oz2QOB2hovnVQ",
      authDomain: "polizei-radar.firebaseapp.com",
      projectId: "polizei-radar",
      storageBucket: "polizei-radar.firebasestorage.app",
      messagingSenderId: "102962929295",
      appId: "1:102962929295:web:6f7808eb4ae21add525afa",
      measurementId: "G-YG2GDEBVYY"
    };

    const HORNSTEIN = [47.8808, 16.4417];
    const DEFAULT_ZOOM = 14;
    const REPORT_MAX_AGE_MIN = 90;
    const REPORT_OLD_AFTER_MIN = 20;

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const reportsRef = collection(db, "reports");

    // --- CLIENT ID ---
    function generateId() {
      if (window.crypto && crypto.randomUUID) {
        try { return crypto.randomUUID(); } catch (_) {}
      }
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }
    function getClientId() {
      let id = localStorage.getItem('polizei_client_id');
      if (!id) {
        id = generateId();
        localStorage.setItem('polizei_client_id', id);
      }
      return id;
    }

    // --- NOTIFICATION ICON ---
    const policeIcon = 'data:image/svg+xml;base64,' + btoa(
      `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2563eb"/><text x="32" y="44" text-anchor="middle" font-size="36">🚔</text></svg>`
    );

    // --- MAP ---
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: true
    }).setView(HORNSTEIN, DEFAULT_ZOOM);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // --- TOAST ---
    let toastTimer;
    function showToast(msg, duration = 2500) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    // --- GEOLOCATION ---
    function centerOnUser() {
      if (!navigator.geolocation) {
        showToast('Standort nicht verfügbar');
        return;
      }
      showToast('Standort wird ermittelt…', 1500);
      navigator.geolocation.getCurrentPosition(
        (pos) => map.setView([pos.coords.latitude, pos.coords.longitude], 16),
        (err) => {
          console.warn('Geolocation error:', err.message);
          showToast('Standort nicht verfügbar');
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
      );
    }
    document.getElementById('locate-btn').addEventListener('click', centerOnUser);

    // --- NOTIFICATIONS ---
    function updateNotifyButton() {
      const icon = document.getElementById('notify-icon');
      const btn = document.getElementById('notify-btn');
      if (!('Notification' in window)) {
        icon.textContent = '🔕';
        btn.disabled = true;
        return;
      }
      if (Notification.permission === 'granted') {
        icon.textContent = '🔔';
        btn.classList.add('active');
      } else {
        icon.textContent = '🔕';
        btn.classList.remove('active');
      }
    }
    updateNotifyButton();

    document.getElementById('notify-btn').addEventListener('click', async () => {
      if (!('Notification' in window)) {
        showToast('Benachrichtigungen nicht unterstützt');
        return;
      }
      if (Notification.permission === 'granted') {
        showToast('Benachrichtigungen sind aktiv');
        return;
      }
      if (Notification.permission === 'denied') {
        showToast('Blockiert – in den Browser-Einstellungen erlauben');
        return;
      }
      try {
        const result = await Notification.requestPermission();
        updateNotifyButton();
        if (result === 'granted') {
          showToast('Benachrichtigungen aktiviert ✓');
          new Notification('Polizei Radar', {
            body: 'Du wirst ab jetzt bei neuen Meldungen benachrichtigt.',
            icon: policeIcon
          });
        } else {
          showToast('Nicht aktiviert');
        }
      } catch (e) {
        showToast('Fehler beim Aktivieren');
      }
    });

    // --- HINT ---
    const hintEl = document.getElementById('hint');
    function hideHint() {
      hintEl.classList.add('hidden');
      localStorage.setItem('polizei_has_reported', 'true');
    }
    if (localStorage.getItem('polizei_has_reported') === 'true') hideHint();

    // --- REPORT ON MAP TAP ---
    map.on('click', async (e) => {
      try {
        await addDoc(reportsRef, {
          lat: e.latlng.lat,
          lng: e.latlng.lng,
          time: serverTimestamp(),
          clientId: getClientId(),
          confirmations: 1
        });
        hideHint();
        if (navigator.vibrate) navigator.vibrate(30);
        showToast('Meldung hinzugefügt');
      } catch (err) {
        console.error(err);
        showToast('Konnte nicht speichern');
      }
    });

    // --- CONFIRM ("Noch da") ---
    window.confirmReport = async function(docId) {
      try {
        await updateDoc(doc(db, 'reports', docId), {
          time: serverTimestamp(),
          confirmations: increment(1)
        });
        showToast('Bestätigt ✓');
        if (navigator.vibrate) navigator.vibrate(20);
      } catch (err) {
        console.error(err);
        showToast('Konnte nicht bestätigen');
      }
    };

    // --- DELETE ---
    window.deleteReport = async function(docId) {
      if (!confirm('Diese Meldung entfernen?')) return;
      try {
        await deleteDoc(doc(db, 'reports', docId));
        showToast('Meldung entfernt');
        if (navigator.vibrate) navigator.vibrate(20);
      } catch (err) {
        console.error(err);
        showToast('Konnte nicht entfernen');
      }
    };

    // --- TIME HELPERS ---
    function toDate(t) {
      if (!t) return null;
      if (t.toDate) return t.toDate();
      if (t instanceof Date) return t;
      if (typeof t === 'number') return new Date(t);
      return null;
    }

    function timeAgo(t) {
      const d = toDate(t);
      if (!d) return 'gerade eben';
      const s = Math.floor((Date.now() - d.getTime()) / 1000);
      if (s < 60) return 'gerade eben';
      const m = Math.floor(s / 60);
      if (m < 60) return `vor ${m} Min.`;
      const h = Math.floor(m / 60);
      return `vor ${h} Std.`;
    }

    function ageMinutes(t) {
      const d = toDate(t);
      if (!d) return 0;
      return (Date.now() - d.getTime()) / 60000;
    }

    // --- POPUP HTML ---
    function buildPopupHtml(docId, timestamp, confirmations = 0) {
      const confirmedText = confirmations > 0
        ? ` · ${confirmations}× bestätigt`
        : '';
      return `
        <div class="popup">
          <div class="popup-title">🚔 Polizei</div>
          <div class="popup-age">${timeAgo(timestamp)}${confirmedText}</div>
          <button class="popup-confirm" onclick="window.confirmReport('${docId}')">
            ✓ Noch da
          </button>
          <button class="popup-clear" onclick="window.deleteReport('${docId}')">
            Entfernen
          </button>
        </div>
      `;
    }

    // --- MARKERS ---
    const markers = new Map();

    function makeMarker(lat, lng, docId, timestamp, confirmations = 0) {
      const isOld = ageMinutes(timestamp) > REPORT_OLD_AFTER_MIN;
      const icon = L.divIcon({
        html: `<div class="police-marker-wrap ${isOld ? 'old' : ''}">
                 <div class="police-marker ${isOld ? 'old' : ''}">🚔</div>
               </div>`,
        className: '',
        iconSize: [40, 40],
        iconAnchor: [20, 20]
      });

      const marker = L.marker([lat, lng], { icon });
      marker.bindPopup(buildPopupHtml(docId, timestamp, confirmations), {
        minWidth: 200,
        maxWidth: 260,
        closeButton: false,
        offset: [0, -12]
      });
      marker.on('popupopen', () => {
        marker.setPopupContent(buildPopupHtml(docId, timestamp, confirmations));
      });
      return marker;
    }

    // --- STATUS PILL ---
    function updateStatusPill() {
      const pill = document.getElementById('status-pill');
      const n = markers.size;
      if (n === 0) {
        pill.textContent = 'Keine Meldungen';
        pill.classList.add('empty');
      } else {
        pill.textContent = n === 1 ? '1 Meldung aktiv' : `${n} Meldungen aktiv`;
        pill.classList.remove('empty');
      }
    }

    // --- CLEANUP ---
    async function cleanupOldReports() {
      try {
        const cutoff = new Date(Date.now() - REPORT_MAX_AGE_MIN * 60 * 1000);
        const q = query(reportsRef, where('time', '<', cutoff));
        const snap = await getDocs(q);
        let count = 0;
        for (const d of snap.docs) {
          try {
            await deleteDoc(d.ref);
            count++;
          } catch (_) {}
        }
        if (count > 0) console.log(`Cleaned up ${count} old report(s)`);
      } catch (e) {
        console.warn('Cleanup failed:', e.message);
      }
    }

    // --- FIRESTORE LISTENER ---
    let isInitialLoad = true;

    onSnapshot(reportsRef, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        const id = change.doc.id;
        const data = change.doc.data();

        // Handle "Noch da" updates — refresh timestamp + popup
        if (change.type === 'modified') {
          const entry = markers.get(id);
          if (entry) {
            entry.data = data;
            entry.marker.setPopupContent(
              buildPopupHtml(id, data.time, data.confirmations || 0)
            );

            const isOld = ageMinutes(data.time) > REPORT_OLD_AFTER_MIN;
            const el = entry.marker.getElement();
            if (el) {
              const wrap = el.querySelector('.police-marker-wrap');
              const dot = el.querySelector('.police-marker');
              if (wrap && dot) {
                wrap.classList.toggle('old', isOld);
                dot.classList.toggle('old', isOld);
              }
            }
          }
          return;
        }

        // Handle new reports
        if (change.type === 'added') {
          if (ageMinutes(data.time) > REPORT_MAX_AGE_MIN) {
            deleteDoc(change.doc.ref).catch(() => {});
            return;
          }

          const marker = makeMarker(
            data.lat, data.lng, id, data.time, data.confirmations || 0
          ).addTo(map);

          markers.set(id, { marker, data });

          if (!isInitialLoad && 'Notification' in window && Notification.permission === 'granted') {
            const isMine = data.clientId === getClientId();
            const recentlyAdded = ageMinutes(data.time) < 1;
            if (!isMine && recentlyAdded) {
              try {
                new Notification('🚔 Polizei gemeldet', {
                  body: 'In deiner Nähe wurde eine Polizei gemeldet.',
                  icon: policeIcon,
                  tag: 'police-new',
                  renotify: true
                });
              } catch (e) { /* ignore */ }
            }
          }
        }

        // Handle deletions
        if (change.type === 'removed') {
          const entry = markers.get(id);
          if (entry) {
            map.removeLayer(entry.marker);
            markers.delete(id);
          }
        }
      });

      updateStatusPill();
      isInitialLoad = false;
    }, (err) => {
      console.error('Snapshot error:', err);
      showToast('Verbindungsfehler – Seite neu laden');
    });

    // --- STARTUP ---
    cleanupOldReports();
    setInterval(cleanupOldReports, 10 * 60 * 1000);

    // Refresh marker styling (old/new) every minute
    setInterval(() => {
      markers.forEach(({ marker, data }) => {
        const isOld = ageMinutes(data.time) > REPORT_OLD_AFTER_MIN;
        const el = marker.getElement();
        if (!el) return;
        const wrap = el.querySelector('.police-marker-wrap');
        const dot = el.querySelector('.police-marker');
        if (wrap && dot) {
          wrap.classList.toggle('old', isOld);
          dot.classList.toggle('old', isOld);
        }
      });
    }, 60 * 1000);
  </script>
</body>
</html>
